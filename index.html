<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="src/style.css" />

    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <title>IDN CART</title>
  </head>
  <body>
    <!-- header -->
    <header class="shadow-sm py-4 bg-white">
      <div class="container flex items-center justify-between">
        <!-- logo -->
        <a href="index.html">
          <img src="public/images/logo.svg" alt="" />
        </a>

        <!-- searchbar -->
        <div class="w-full flex max-w-xl relative">
          <span class="absolute left-4 top-3 text-lg text-gray-400">
            <i class="fa-solid fa-magnifying-glass"></i>
          </span>
          <input
            type="text"
            class="w-full border border-primary border-r-0 pl-12 py-3 rounded-l-md focus:outline-none"
            placeholder="Search"
          />
          <button
            class="bg-primary border border-primary text-white px-8 rounded-r-md hover:bg-transparent hover:text-primary transition"
          >
            Search
          </button>
        </div>

        <!-- icon -->
        <div class="flex items-center space-x-4">
          <a
            href=""
            class="text-center text-gray-600 hover:text-primary transition relative"
          >
            <div class="text-2xl">
              <i class="fa-regular fa-heart"></i>
            </div>
            <div class="text-xs leading-3">Wishlist</div>
            <span
              class="text-xs absolute bg-primary rounded-full text-white flex items-center justify-center w-4 h-4 right-0 -top-0"
              >8</span
            >
          </a>
          <a
            href=""
            class="text-center text-gray-600 hover:text-primary transition relative"
          >
            <div class="text-2xl">
              <i class="fa-solid fa-cart-shopping"></i>
            </div>
            <div class="text-xs leading-3">Cart</div>
            <span
              class="text-xs absolute bg-primary rounded-full text-white flex items-center justify-center w-4 h-4 -right-1 -top-0 text"
              >14</span
            >
          </a>
          <a
            href=""
            class="text-center text-gray-600 hover:text-primary transition relative"
          >
            <div class="text-2xl">
              <i class="fa-solid fa-user"></i>
            </div>
            <div class="text-xs leading-3">User</div>
          </a>
        </div>

        <!-- header end -->
      </div>
    </header>
    <!-- header end -->

    <!-- navbar -->
    <nav class="bg-gray-800">
      <div class="container flex">
        <!-- all category -->
        <div class="px-8 py-4 bg-primary flex items-center cursor-pointer relative group">
          <span class="text-white mr-1">
            <i class="fa-solid fa-bars"></i>
          </span>
          <span class="capitalize text-white">All Categories</span>
          <!-- dropdown -->
          <div class="absolute w-full left-0 top-full bg-white shadow-md py-3 divide-y divide-gray-300 opacity-0 group-hover:opacity-100 transition invisible group-hover:visible">
            <!-- single category -->
             <a class="flex px-6 py-3 items-center hover:bg-gray-100 transition" href="">
              <img src="public/images/icons/sofa.svg" class="w-5 h-5 object-contain" alt="">
              <span class="text-gray-600 text-sm ml-6 capitalize">sofa</span>
             </a>
             <a class="flex px-6 py-3 items-center hover:bg-gray-100 transition" href="">
              <img src="public/images/icons/phone.svg" class="w-5 h-5 object-contain" alt="">
              <span class="text-gray-600 text-sm ml-6 capitalize">Phone</span>
             </a>
             <a class="flex px-6 py-3 items-center hover:bg-gray-100 transition" href="">
              <img src="public/images/icons/delivery-van.svg" class="w-5 h-5 object-contain" alt="">
              <span class="text-gray-600 text-sm ml-6 capitalize">van</span>
             </a>
             <a class="flex px-6 py-3 items-center hover:bg-gray-100 transition" href="">
              <img src="public/images/icons/outdoor-cafe.svg" class="w-5 h-5 object-contain" alt="">
              <span class="text-gray-600 text-sm ml-6 capitalize">outdoor cafe</span>
             </a>
             <a class="flex px-6 py-3 items-center hover:bg-gray-100 transition" href="">
              <img src="public/images/icons/service-hours.svg" class="w-5 h-5 object-contain" alt="">
              <span class="text-gray-600 text-sm ml-6 capitalize">service hours</span>
             </a>
             <a class="flex px-6 py-3 items-center hover:bg-gray-100 transition" href="">
              <img src="public/images/icons/terrace.svg" class="w-5 h-5 object-contain" alt="">
              <span class="text-gray-600 text-sm ml-6 capitalize">terrace</span>
             </a>
          </div>
        </div>
        <!-- all category end -->
        <!-- nav link -->
        <div class="flex justify-between pl-12 items-center flex-grow">
          <div class="flex space-x-6">
            <a class="text-gray-300 hover:text-white transition" href=""
              >Home</a
            >
            <a class="text-gray-300 hover:text-white transition" href=""
              >Shop</a
            >
            <a class="text-gray-300 hover:text-white transition" href=""
              >About us</a
            >
            <a class="text-gray-300 hover:text-white transition" href=""
              >contact us</a
            >
          </div>
          <div class="space-x-6">
            <a class="text-gray-300 hover-text transition" href="">Login</a>
            <a class="text-gray-300 hover-text transition" href="">Register</a>
          </div>
        </div>
        <!-- nav link end -->
      </div>
    </nav>
    <!-- navbar end -->
  </body>
</html>
